# Builds and tests every PR; deploys the API (and poller) to Azure App Service on merge to main.
name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - run: dotnet restore
      - run: dotnet build --no-restore -c Release

      # Integration tests start their own Postgres via Testcontainers (Docker is available on ubuntu-latest).
      - run: dotnet test --no-build -c Release

      - run: dotnet publish src/TransportTracker.Api -c Release -o ${{ runner.temp }}/api

      - uses: actions/upload-artifact@v4
        with:
          name: api
          path: ${{ runner.temp }}/api

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    # A deploy restarts the poller, so never let two run at once.
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: api
          path: api

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: api
