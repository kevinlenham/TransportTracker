# Local development database. Azure uses Azure Database for PostgreSQL Flexible Server.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: transporttracker
      POSTGRES_USER: transporttracker
      POSTGRES_PASSWORD: localdev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
